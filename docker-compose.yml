# The whole stack.
#
#   docker compose up -d          brings up storage, runs migrations, starts the app
#   docker compose up -d --scale worker=3    adds encoding capacity
#
# Behind a TLS-intercepting proxy (corporate egress, some CI sandboxes) add the
# override that supplies a CA to the build:
#   docker compose -f docker-compose.yml -f docker-compose.ca.yml build
#
# Secrets come from .env, which is not in the repo. Copy .env.example and fill
# it in; `docker compose config` will tell you what is still missing.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dropreel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dropreel}
      POSTGRES_DB: ${POSTGRES_DB:-dropreel}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dropreel}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No persistence: everything in Redis is a queue or a counter that is
    # rebuilt from Postgres. Losing it costs an in-flight transcode, not money.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Stands in for Cloudflare R2 locally — same S3 API, so the storage driver is
  # identical in dev and production. In production, delete this service and
  # point S3_ENDPOINT at R2.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    profiles: ["local-storage"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    profiles: ["local-storage"]
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-minioadmin} ${S3_SECRET_ACCESS_KEY:-minioadmin} &&
      mc mb -p local/${S3_BUCKET:-dropreel-media} &&
      mc anonymous set download local/${S3_BUCKET:-dropreel-media} &&
      echo 'bucket ready'
      "

  # Runs to completion before api and worker start. Idempotent: applying an
  # already-applied migration is a no-op, so it is safe on every boot.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrate
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgresql://dropreel:dropreel@postgres:5432/dropreel}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    env_file: [.env]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgresql://dropreel:dropreel@postgres:5432/dropreel}
      REDIS_URL: ${REDIS_URL_INTERNAL:-redis://redis:6379}
    ports: ["4000:4000"]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    env_file: [.env]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgresql://dropreel:dropreel@postgres:5432/dropreel}
      REDIS_URL: ${REDIS_URL_INTERNAL:-redis://redis:6379}
      TRANSCODE_TMP_DIR: /tmp/dropreel
    # Transcoding is the CPU cost centre. Scale this service and nothing else:
    #   docker compose up -d --scale worker=4
    deploy:
      replicas: 1

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Next inlines NEXT_PUBLIC_* at build time, so changing where the API
        # lives means rebuilding this image, not restarting it.
        NEXT_PUBLIC_API_URL: ${API_PUBLIC_URL:-http://127.0.0.1:4000}
    restart: unless-stopped
    depends_on: [api]
    environment:
      NODE_ENV: production
      # Server components render inside this container, where the public API
      # origin is not reachable. Read at run time, so the image is portable.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
    ports: ["3000:3000"]

volumes:
  pgdata:
  miniodata:
