services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: umf
      POSTGRES_PASSWORD: umf
      POSTGRES_DB: umf
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umf"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Stands in for Cloudflare R2 locally - same S3 API, so the storage driver
  # is identical in dev and production.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb -p local/umf-media &&
      mc anonymous set download local/umf-media &&
      echo 'bucket ready'
      "

  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://umf:umf@postgres:5432/umf
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      MEDIA_PUBLIC_BASE_URL: http://127.0.0.1:9000/umf-media
    env_file: [.env]
    ports: ["4000:4000"]

  worker:
    build: { context: ., dockerfile: apps/worker/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://umf:umf@postgres:5432/umf
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    env_file: [.env]
    # Transcoding is the CPU cost centre; scale this service, not the API.
    deploy:
      replicas: 1

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    depends_on: [api]
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
    env_file: [.env]
    ports: ["3000:3000"]

volumes:
  pgdata:
  miniodata:
